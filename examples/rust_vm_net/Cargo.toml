[package]
name = "rust_vm_net"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
env_logger = "0.11"
msb_krun = { path = "../../src/krun", features = ["net"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Pipes"] }
