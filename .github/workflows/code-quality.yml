name: Code Quality
on: [pull_request]

jobs:
  code-quality-linux-x86_64:
    name: libkrun (Linux x86_64)
    runs-on: ubuntu-latest
    env:
      # libspa 0.8 uses bindgen 0.69, which emits opaque structs with Clang 22.
      # Select the distro's installed Clang 21 instead of the runner's newest LLVM.
      LIBCLANG_PATH: /usr/lib/llvm-21/lib
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
      
      - name: Create a fake init
        run: touch init/init
      
      - name: Clippy (default)
        run: cargo clippy --locked -- -D warnings
      
      - name: Clippy (amd-sev)
        run: cargo clippy --locked --features amd-sev -- -D warnings
      
      - name: Clippy (tdx)
        run: cargo clippy --locked --features tdx -- -D warnings
      
      - name: Regenerate PipeWire bindings with distro Clang
        run: |
          test -r "$LIBCLANG_PATH/libclang.so"
          # The shared target cache may contain bindings generated by Clang 22.
          cargo clean -p libspa-sys -p pipewire-sys

      - name: Clippy (net+blk+gpu+snd+input)
        run: cargo clippy --locked --features net,blk,gpu,snd,input -- -D warnings

  code-quality-linux-aarch64:
    name: libkrun (Linux aarch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
      
      - name: Create a fake init
        run: touch init/init
      
      - name: Clippy (default)
        run: cargo clippy --locked -- -D warnings
      
      - name: Clippy (net+blk+gpu+snd+input)
        run: cargo clippy --locked --features net,blk,gpu,snd,input -- -D warnings

  code-quality-macos:
    name: libkrun (macOS aarch64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
      
      - name: Create a fake init
        run: touch init/init

      - name: Vsock queue and stream regressions
        timeout-minutes: 5
        run: cargo test --locked -p msb_krun_devices --lib 'virtio::vsock::'
      
      - name: Clippy (efi+gpu)
        run: cargo clippy --locked --features efi,gpu -- -D warnings

  code-quality-examples:
    name: ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - name: "Examples (Linux x86_64)"
            runner: ubuntu-latest
          
          - name: "Examples (Linux aarch64)"
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
      
      - name: Cache GTK 4.16 build
        uses: actions/cache@v4
        id: gtk-cache
        with:
          path: ~/gtk-prefix
          key: ${{ runner.os }}-${{ matrix.runner }}-${{ runner.arch }}-gtk-4.16.0-system-glib-v1
      
      - name: Install GTK system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -yqq --no-install-recommends \
            libglib2.0-dev \
            libffi-dev \
            libmount-dev \
            libpcre2-dev \
            zlib1g-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libgraphene-1.0-dev \
            libepoxy-dev \
            libxkbcommon-dev \
            wayland-protocols \
            libwayland-dev
      
      - name: Add GTK paths to environment
        run: |
          case "$(uname -m)" in
            x86_64)
              GTK_PKG_CONFIG_PATH="$HOME/gtk-prefix/lib/x86_64-linux-gnu/pkgconfig"
              GTK_LIB_PATH="$HOME/gtk-prefix/lib/x86_64-linux-gnu" ;;
            aarch64)
              GTK_PKG_CONFIG_PATH="$HOME/gtk-prefix/lib/aarch64-linux-gnu/pkgconfig"
              GTK_LIB_PATH="$HOME/gtk-prefix/lib/aarch64-linux-gnu" ;;
            *)
              echo "ERROR: Unsupported architecture: $(uname -m)"
              exit 1 ;;
          esac
          
          echo "PKG_CONFIG_PATH=$GTK_PKG_CONFIG_PATH:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$GTK_LIB_PATH:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Build and install GTK 4.16 from source
        if: steps.gtk-cache.outputs.cache-hit != 'true'
        run: |
          # Install build-only dependencies  
          sudo apt-get install -yqq --no-install-recommends \
            build-essential \
            meson \
            ninja-build
          
          
          # GTK 4.16 requires GLib >= 2.76, already provided by these Ubuntu runners.
          # Keep the distro tools and libraries together: a private older GLib can
          # shadow the system library and break glib-compile-resources at startup.
          pkg-config --atleast-version=2.76.0 glib-2.0 gio-2.0
          glib-compile-resources --version

          # Build GTK
          cd /tmp
          curl -L -o gtk-4.16.0.tar.xz https://download.gnome.org/sources/gtk/4.16/gtk-4.16.0.tar.xz
          tar -xf gtk-4.16.0.tar.xz
          cd gtk-4.16.0
          meson setup builddir --prefix=$HOME/gtk-prefix --buildtype=release \
            -Dmedia-gstreamer=disabled \
            -Dintrospection=disabled \
            -Dx11-backend=false \
            -Dprint-cups=disabled \
            -Dcloudproviders=disabled \
            -Dtracker=disabled \
            -Dcolord=disabled \
            -Dsysprof=disabled \
            -Dvulkan=disabled
          meson compile -C builddir
          meson install -C builddir
      
      - name: Build and install libkrun to local prefix
        run: |
          mkdir -p $HOME/libkrun-prefix
          GPU=1 NET=1 INPUT=1 PREFIX=$HOME/libkrun-prefix make && PREFIX=$HOME/libkrun-prefix make install
      
      - name: Clippy (examples workspace)
        run: |
          cd examples
          PKG_CONFIG_PATH="$HOME/libkrun-prefix/lib64/pkgconfig:$PKG_CONFIG_PATH" LD_LIBRARY_PATH="$HOME/libkrun-prefix/lib64:$LD_LIBRARY_PATH" cargo clippy --locked -- -D warnings
