name: Unit tests
on: [pull_request]

jobs:
  unit-tests-linux-x86_64:
    name: Unit tests (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
      
      - name: Create a fake init
        run: touch init/init
      
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo usermod -a -G kvm $USER

      - name: Unit tests
        run: cargo test

  unit-tests-windows-x86_64:
    name: Unit tests (Windows x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Windows errno translation tests
        run: cargo test --locked --manifest-path src/devices/Cargo.toml virtio::linux_errno::tests

      - name: Windows DAX default error test
        run: cargo test --locked --manifest-path src/devices/Cargo.toml virtio::fs::dyn_filesystem::tests

      - name: Windows passthrough error test
        run: cargo test --locked --manifest-path src/devices/Cargo.toml read_translates_zero_copy_win32_errors

      - name: Windows device Clippy
        run: cargo clippy --locked --manifest-path src/devices/Cargo.toml -- -D warnings

