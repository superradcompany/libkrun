name: Release tooling
on:
  pull_request:
    paths:
      - 'scripts/*publish*'
      - '.github/workflows/publish-crates*.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts -p 'test_publish_crates.py'
