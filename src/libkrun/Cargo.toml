[package]
name = "libkrun"
version = "1.17.3"
authors = ["The libkrun Authors"]
edition = "2021"
publish = false
build = "build.rs"

[features]
tee = ["devices/tee", "vmm/tee"]
amd-sev = ["blk", "tee", "devices/amd-sev", "vmm/amd-sev"]
tdx = ["blk", "tee", "devices/tdx", "vmm/tdx"]
net = ["devices/net", "vmm/net"]
blk = ["devices/blk", "vmm/blk"]
efi = ["blk", "net", "devices/efi", "vmm/efi"]
gpu = ["krun_display", "devices/gpu", "vmm/gpu"]
pci = ["devices/pci", "vmm/pci"]
vfio = ["pci", "devices/vfio", "vmm/vfio"]
snd = ["devices/snd", "vmm/snd"]
input = ["krun_input", "vmm/input", "devices/input"]
virgl_resource_map2 = []
aws-nitro = ["dep:aws-nitro", "dep:nitro-enclaves", "devices/aws-nitro", "vmm/aws-nitro"]

[dependencies]
crossbeam-channel = ">=0.5.15"
env_logger = "0.11"
libc = ">=0.2.39"
libloading = "0.8"
log = "0.4.0"
once_cell = "1.4.1"
krun_display = { package = "msb_krun_display", path = "../krun_display", optional = true, features = ["bindgen_clang_runtime"] }
krun_input = { package = "msb_krun_input", path = "../krun_input", optional = true, features = ["bindgen_clang_runtime"] }

devices = { package = "msb_krun_devices", path = "../devices" }
polly = { package = "msb_krun_polly", path = "../polly" }
utils = { package = "msb_krun_utils", path = "../utils" }
vmm = { package = "msb_krun_vmm", path = "../vmm" }
rand = "0.9.2"

[target.'cfg(target_os = "macos")'.dependencies]
hvf = { package = "msb_krun_hvf", path = "../hvf" }

[target.'cfg(target_os = "linux")'.dependencies]
kvm-bindings = { version = ">=0.11", features = ["fam-wrappers"] }
kvm-ioctls = ">=0.21"
aws-nitro = { package = "msb_krun_aws_nitro", path = "../aws_nitro", optional = true }
nitro-enclaves = { version = "0.5.0", optional = true }
vm-memory = { package = "msb-vm-memory", version = "=0.18.0-msb.1", default-features = false, features = ["backend-mmap"] }

[lib]
name = "krun"
crate-type = ["cdylib"]
